
services:
  api:
    image: product-template-api
    build:
      context: .
      dockerfile: src/Api/Dockerfile
    env_file:
      - path: compose.env
        required: false
    depends_on:
      postgres:
        condition: service_healthy
      tempo:
        condition: service_started
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__HostDb=Host=postgres;Port=5432;Database=ProductTemplateHost;Username=postgres;Password=${POSTGRES_PASSWORD:-dev-postgres-change-me}
      - ConnectionStrings__AppDb=Host=postgres;Port=5432;Database=ProductTemplateApp;Username=postgres;Password=${POSTGRES_PASSWORD:-dev-postgres-change-me}
      - MultiTenancy__Provider=PostgreSQL
      - OpenTelemetry__OtlpTracesEndpoint=http://tempo:4317
      - OpenTelemetry__OtlpEndpoint=http://tempo:4317
      - Serilog__WriteTo__2__Args__serverUrl=http://seq:80
      - Monitoring__ApiKey=${MONITORING_API_KEY:-}
      - Monitoring__RequireApiKeyInDevelopment=${MONITORING_REQUIRE_KEY_IN_DEV:-false}
    ports:
      - "8080:8080"
    networks:
      - product-template-network

  postgres:
    image: postgres:17
    container_name: product-template-postgres
    env_file:
      - path: compose.env
        required: false
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dev-postgres-change-me}
      POSTGRES_USER: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - product-template-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  seq:
    image: datalust/seq:latest
    container_name: product-template-seq
    env_file:
      - path: compose.env
        required: false
    environment:
      ACCEPT_EULA: "Y"
      SEQ_FIRSTRUN_ADMINPASSWORD: ${SEQ_FIRSTRUN_ADMINPASSWORD:-dev-seq-change-me}
    ports:
      - "5341:80"
    volumes:
      - seq_data:/data
    networks:
      - product-template-network

  tempo:
    image: grafana/tempo:2.6.1
    container_name: product-template-tempo
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./infra/tempo/tempo.yaml:/etc/tempo.yaml
      - tempo_data:/var/tempo
    ports:
      - "3200:3200"
      - "4317:4317"
      - "4318:4318"
    networks:
      - product-template-network

  prometheus:
    image: prom/prometheus:latest
    container_name: product-template-prometheus
    env_file:
      - path: compose.env
        required: false
    entrypoint:
      - /bin/sh
      - -c
      - |
        if [ -n "$$MONITORING_API_KEY" ]; then
          sed "s|__MONITORING_API_KEY__|$$MONITORING_API_KEY|g" /etc/prometheus/prometheus.yml.template > /tmp/prometheus.yml
        else
          sed '/# MONITORING_HEADER_START/,/# MONITORING_HEADER_END/d' /etc/prometheus/prometheus.yml.template > /tmp/prometheus.yml
        fi
        exec /bin/prometheus --config.file=/tmp/prometheus.yml --storage.tsdb.path=/prometheus --storage.tsdb.retention.time=15d --web.enable-lifecycle --web.enable-remote-write-receiver
    volumes:
      - ./infra/prometheus/prometheus.yml.template:/etc/prometheus/prometheus.yml.template:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    depends_on:
      - api
    networks:
      - product-template-network

  grafana:
    image: grafana/grafana:latest
    container_name: product-template-grafana
    env_file:
      - path: compose.env
        required: false
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-dev-grafana-change-me}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_FEATURE_TOGGLES_ENABLE=traceqlEditor
      - GF_INSTALL_PLUGINS=grafana-clock-panel
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/etc/grafana/dashboards:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
      - tempo
    networks:
      - product-template-network

networks:
  product-template-network:
    driver: bridge

volumes:
  postgres_data:
  seq_data:
  tempo_data:
  prometheus_data:
  grafana_data:
